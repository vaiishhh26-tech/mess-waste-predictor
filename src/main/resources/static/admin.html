<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Dashboard</title>
<style>
  :root {
    --bg: #f3f6f4; --card: #ffffff; --ink: #14312f; --muted: #5d7371;
    --teal: #0f5c57; --turmeric: #e8a317; --line: #d5dfdc; --yes: #1f8a4c; --no: #c4452d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1f1e; --card: #162a28; --ink: #e8f1ef; --muted: #9db5b2;
            --teal: #3fb5ab; --line: #284340; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 900px; margin: 0 auto; padding: 28px 18px 40px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 1.1rem; }
  .plates { font-size: 2.6rem; font-weight: 800; color: var(--turmeric); line-height: 1; }
  .plates small { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .row { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); }
  .row b { color: var(--ink); }
  .bar { height: 10px; border-radius: 6px; background: var(--no); margin-top: 16px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--yes); }
  .legend { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .saved { margin-top: 24px; font-size: 1.1rem; font-weight: 600; }
  .saved b { color: var(--yes); font-size: 1.5rem; }
  a { color: var(--teal); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Today's plate plan</h1>
  <p class="sub">Cook this many plates for each meal. Numbers refresh every 10 seconds.</p>
  <div class="grid" id="grid">Loading...</div>
  <p class="saved" id="saved"></p>
  <p><a href="index.html">Back to student page</a></p>
</main>

<script>
  async function load() {
    try {
      const res = await fetch("/api/summary");
      const data = await res.json();
      const grid = document.getElementById("grid");
      let totalSaved = 0;

      grid.innerHTML = data.map(m => {
        totalSaved += m.platesSaved;
        const pct = m.responses ? Math.round(m.eating / m.responses * 100) : 0;
        const name = m.meal.charAt(0) + m.meal.slice(1).toLowerCase();
        return `
          <div class="card">
            <h2>${name}</h2>
            <div class="plates">${m.predictedPlates}<small>plates to cook</small></div>
            <div class="row"><span>Eating</span><b>${m.eating}</b></div>
            <div class="row"><span>Skipping</span><b>${m.notEating}</b></div>
            <div class="row"><span>Saved vs cooking for all ${m.totalStudents}</span><b>${m.platesSaved}</b></div>
            <div class="bar"><span style="width:${pct}%"></span></div>
            <div class="legend">${pct}% of responders are eating</div>
          </div>`;
      }).join("");

      document.getElementById("saved").innerHTML =
        `Plates saved today: <b>${totalSaved}</b>`;
    } catch (e) {
      document.getElementById("grid").textContent = "Could not load data. Is the Java app running?";
    }
  }
  load();
  setInterval(load, 10000);  // auto refresh
</script>
</body>
</html>
